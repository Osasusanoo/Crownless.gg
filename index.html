<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta property="og:title" content="Crownless.gg — Wuthering Waves Endgame HP Tracker">
    <meta property="og:description" content="Built to provide clarity to Endgame players and CCs.">
    <meta property="og:image" content="https://wuwacrownless.netlify.app/Images/CrownlessggThumbnail.png">
    <meta property="og:url" content="https://wuwacrownless.netlify.app/">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crownless</title>
    <meta name="description" content="A modern gamer-centered starter site with a polished dark theme and easy navigation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="192x192" href="Images/Browser logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="min-h-screen antialiased">
    <header class="nav-glass sticky top-0 z-50 border-b border-slate-800/70">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-8">
        <a href="index.html" class="flex items-center gap-3">
          <img src="Images/CrownlessggThumbnail.png" alt="Crownless thumbnail" class="h-20 w-auto object-contain">
        </a>
        <div class="relative">
          <button id="menu-toggle" class="rounded-full border border-slate-700 bg-slate-900/70 p-2.5 text-slate-200 transition hover:border-slate-500" aria-expanded="false" aria-label="Open menu">
            <span class="block h-0.5 w-5 bg-current"></span>
            <span class="mt-1 block h-0.5 w-5 bg-current"></span>
            <span class="mt-1 block h-0.5 w-5 bg-current"></span>
          </button>
          <div id="menu-dropdown" class="absolute right-0 mt-2 hidden w-44 rounded-2xl border border-slate-700 bg-slate-900/95 p-2 shadow-2xl backdrop-blur">
            <a class="block rounded-xl px-3 py-2 text-sm text-slate-300 transition hover:bg-slate-800 hover:text-white" href="index.html">Home</a>
            <a class="block rounded-xl px-3 py-2 text-sm text-slate-300 transition hover:bg-slate-800 hover:text-white" href="about.html">About</a>
            <a class="block rounded-xl px-3 py-2 text-sm text-slate-300 transition hover:bg-slate-800 hover:text-white" href="chart.html">Chart</a>
            <a class="block rounded-xl px-3 py-2 text-sm text-slate-300 transition hover:bg-slate-800 hover:text-white" href="team.html">Team</a>
          </div>
        </div>
      </div>
    </header>

    <main class="mx-auto flex max-w-7xl flex-col gap-8 px-6 py-10 lg:px-8 lg:py-16">
      <section class="card relative overflow-hidden rounded-3xl p-8 lg:p-12">
        <img src="Images/Augusta-removebg-preview.png" alt="Augusta artwork" class="pointer-events-none absolute left-0 top-0 z-0 h-full w-full max-w-[28rem] object-contain opacity-25" />
        <div class="relative z-10 grid gap-8 lg:grid-cols-[0.8fr_1.2fr] lg:items-center">
          <div class="hidden lg:block"></div>
          <div class="rounded-2xl border border-slate-700/80 bg-slate-950/70 p-6 shadow-2xl backdrop-blur">
            <h1 class="text-4xl font-bold sm:text-5xl">Wuthering Waves Endgame HP Tracker</h1>
            <p class="mt-4 max-w-2xl text-lg text-slate-300">Built to provide clarity to Endgame players and CCs.</p>
            <p class="mt-6 text-xl font-semibold leading-relaxed text-slate-100">
              Face the <span style="font-family: 'Cinzel', serif;">Tower</span>, <span class="font-semibold text-[#8b2e0f]" style="font-family: 'Cinzel', serif;">Conquer</span> the <span style="font-family: 'Cinzel', serif;">Adversity</span>
            </p>
            <div class="mt-8 flex flex-wrap gap-3">
              <a href="chart.html" class="rounded-full bg-violet-600 px-5 py-3 font-semibold text-white transition hover:bg-violet-500">View chart page</a>
              <a href="team.html" class="rounded-full border border-slate-700 px-5 py-3 font-semibold text-slate-200 transition hover:bg-slate-800">Meet the team</a>
            </div>
          </div>
        </div>
      </section>

      <section class="grid gap-6 md:grid-cols-3">
        <a href="about.html" class="card flex items-center gap-4 rounded-2xl p-6 transition hover:-translate-y-1 hover:border-slate-500">
          <img src="Images/encoreHI.png" alt="Encore character art" class="h-16 w-16 rounded-2xl object-cover" />
          <h3 class="text-lg font-semibold">About</h3>
        </a>
        <a href="chart.html" class="card flex items-center gap-4 rounded-2xl border border-sky-400/40 bg-sky-500/10 p-6 transition hover:-translate-y-1 hover:border-slate-500 hover:bg-slate-800/80">
          <img src="Images/ChixiaHi.png" alt="Chixia character art" class="h-16 w-16 rounded-2xl object-cover" />
          <h3 class="text-lg font-semibold">Charts</h3>
        </a>
        <article class="card flex items-center gap-4 rounded-2xl p-6 transition hover:-translate-y-1 hover:border-slate-500 hover:bg-slate-800/80">
          <img src="Images/AltoHI.png" alt="Alto character art" class="h-16 w-16 rounded-2xl object-cover" />
          <h3 class="text-lg font-semibold">All Bosses</h3>
        </article>
      </section>
    </main>

    <footer id="contact" class="border-t border-slate-800/70 px-6 py-8 text-sm text-slate-400">
      <div class="mx-auto flex max-w-7xl items-center justify-start gap-3">
        <span class="bg-gradient-to-r from-emerald-400 via-amber-400 to-rose-500 bg-clip-text text-xl font-semibold uppercase tracking-[0.35em] text-transparent">CROWNLESS</span>
        <p>Crownless 1.0 • Built for rovers, designed to grow.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
